name: Release Word Linux x86_64 DEB

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without v (empty: Cargo.toml)"
        type: string
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-linux-deb-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  linux-deb:
    name: Linux x86_64 .deb
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: storytold/craft-common-actions/actions/checkout-craft-fonts@main
        with:
          ref: 8dcdacd5153e64560d109541a47d806f26f048c0

      - name: Check out interface translations
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: storytold/craft-i18n
          ref: 04600cbb1508f1b15927ec574a5e32e5f376fd8b
          path: craft-i18n

      - uses: storytold/craft-common-actions/actions/install-linux-deps@main
        with:
          deb-arch: amd64
          nfpm-version: 2.47.0

      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: "1.95"

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-linux-deb-x86_64-rust-1.95

      - name: Resolve release metadata
        id: metadata
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          cargo_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "wordcraft") | .version' | head -n1)"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="$GITHUB_REF_NAME"
            version="${tag#v}"
          elif [[ -n "$INPUT_VERSION" ]]; then
            version="${INPUT_VERSION#v}"
            tag="v$version"
          else
            version="$cargo_version"
            tag="v$version"
          fi

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid release version: $version"
            exit 1
          fi

          {
            echo "version=$version"
            echo "tag=$tag"
            echo "build_date=$(date -u +%F)"
          } >> "$GITHUB_OUTPUT"

      - name: Build release and package DEB
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
          WORDCRAFT_VERSION: ${{ steps.metadata.outputs.version }}
          WORDCRAFT_BUILD_DATE: ${{ steps.metadata.outputs.build_date }}
          WORDCRAFT_BUILD_SHA: ${{ github.sha }}
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
          CRAFT_FONTS_REQUIRED: "1"
          CRAFT_I18N_DIR: ${{ github.workspace }}/craft-i18n
          CRAFT_I18N_REQUIRED: "1"
        run: packaging/linux/package.sh --formats "deb"

      - name: Upload DEB workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Word-${{ steps.metadata.outputs.version }}-linux-x86_64-deb
          path: dist/release/*.deb
          if-no-files-found: error

      - name: Publish DEB as GitHub Release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          debs=(dist/release/*.deb)
          if (( ${#debs[@]} != 1 )); then
            echo "::error::Expected exactly one .deb, found ${#debs[@]}"
            exit 1
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${debs[0]}" --clobber
          else
            # A version with a suffix (0.8.1-ai.1) is a test build: a pre-release, never "Latest".
            prerelease=()
            if [[ "$RELEASE_VERSION" == *-* ]]; then
              prerelease=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" "${debs[0]}" \
              --target "$GITHUB_SHA" \
              --title "Word v$RELEASE_VERSION" \
              --generate-notes \
              "${prerelease[@]}"
          fi

          release_url="$(gh release view "$RELEASE_TAG" --json url --jq .url)"
          asset_url="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[] | select(.name | endswith(".deb")) | .url' | head -n1)"
          {
            echo "## Word Linux x86_64"
            echo
            echo "- Release: $release_url"
            echo "- DEB: $asset_url"
          } >> "$GITHUB_STEP_SUMMARY"
